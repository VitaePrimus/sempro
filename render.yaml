services:
  # Render uses this Blueprint to build and run the FastAPI website.
  - type: web
    name: sempro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
